services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kairos-igreja-backend:latest
    container_name: kairos-igreja-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/kairos.db
      - PYTHONUNBUFFERED=1
      # Provedor de LLM: rules | MiniMax | deepseek | openrouter
      - LLM_PROVIDER=${LLM_PROVIDER:-rules}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # Identidade da igreja (usada nos PDFs)
      - IGREJA_NOME=${IGREJA_NOME:-Igreja Kairos}
      - IGREJA_ENDERECO=${IGREJA_ENDERECO:-Sede - Endereço da Igreja}
      - IGREJA_CNPJ=${IGREJA_CNPJ:-00.000.000/0001-00}
    volumes:
      - kairos-igreja-data:/app/data
      - kairos-igreja-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Porta 8023 exposta no host para Caddy conseguir rotear /api/*
    ports:
      - "8023:8000"
    networks:
      - kairos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL pública do backend — inlined no JS pelo Next
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://igreja.fbautomacao.space/api}
    image: kairos-igreja-frontend:latest
    container_name: kairos-igreja-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    ports:
      - "8024:3000"
    networks:
      - kairos-net

volumes:
  kairos-igreja-data:
    name: kairos-igreja-data
  kairos-igreja-uploads:
    name: kairos-igreja-uploads

networks:
  kairos-net:
    name: kairos-igreja-net
    driver: bridge
